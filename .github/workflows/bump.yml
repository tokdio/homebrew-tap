name: bump outdated formulae

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_BUMP_TOKEN }}

      - name: Bump outdated formulae
        uses: Homebrew/actions/bump-packages@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_BUMP_TOKEN }}
          formulae: agent-statusline
          fork: false
