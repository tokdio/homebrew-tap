name: bump outdated formulae

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.10.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_BUMP_TOKEN }}

      - name: Bump outdated formulae
        uses: Homebrew/actions/bump-packages@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.10.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_BUMP_TOKEN }}
          formulae: agent-statusline
          fork: false
